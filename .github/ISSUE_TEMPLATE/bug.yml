name: Bug
description: A reproducible behavior that doesn't match what's expected.
labels: ["bug"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Affected component
      options:
        - omt-android - SDK (omt-sdk)
        - omt-android - sample-app
        - omtplugin (OBS)
        - libomtnet (C#)
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "E.g. omt-sdk 0.2.1, or the commit SHA."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens vs. what should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "Phone model + Android version, receiver (vMix/OBS + version), network (Wi-Fi 2.4/5 GHz, LAN)."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`adb logcat -s OmtSender OmtBridge OmtDiscovery` on the sender side; receiver log if relevant."
      render: text
