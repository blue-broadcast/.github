name: Bug
description: Un comportement reproductible qui ne correspond pas à l'attendu.
labels: ["bug"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Composant concerné
      options:
        - omt-android - SDK (omt-sdk)
        - omt-android - sample-app
        - omtplugin (OBS)
        - libomtnet (C#)
        - autre / je ne sais pas
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Ex. omt-sdk 0.2.1, ou le SHA du commit."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe vs ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environnement
      description: "Modèle de téléphone + Android, récepteur (vMix/OBS + version), réseau (Wi-Fi 2,4/5 GHz, LAN)."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`adb logcat -s OmtSender OmtBridge OmtDiscovery` côté émetteur ; log du récepteur si pertinent."
      render: text
